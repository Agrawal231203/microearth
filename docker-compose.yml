version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SLPK_CORS_ORIGINS: "http://localhost:5173,http://localhost:80"
      SLPK_PUBLIC_BASE_URL: "http://localhost:8000"
    volumes:
      - slpk_data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # --- Phase 10 forward-path (optional, not wired into the app yet) ---
