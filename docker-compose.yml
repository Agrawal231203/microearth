  #     POSTGRES_USER: gis
  #     POSTGRES_PASSWORD: gis
  #     POSTGRES_DB: gis
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgis_data:/var/lib/postgresql/data

  # --- Production-scale object storage (swap in for local disk storage) ---
  # minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data

volumes:
  slpk_data:
